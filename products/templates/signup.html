{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'styles/main.css' %}">
    <link rel="stylesheet" href="{% static 'styles/bootstrap/css/bootstrap.css' %}">
<style>
    .form-container{
        width: 100%;
        max-width: 500px;
        background-color: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(red, green, blue, alpha);
        box-sizing: border-box;
        margin: 40px auto;
        border: 1px solid #e0e0e0;
    }
    .form-group{
       margin-bottom: 15px; 
       margin-top: 20px;
       font-weight: 100;
       font-size: large;
    }
    input{
       margin-top: 20px; 
       padding: 5px;
    }
    button{
        width: 100%;
        padding: 14px;
        background-color: blue;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }
    button :hover{
        background-color: blanchedalmond;
    }
    .footer-text{
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #666666;
    }
    .footer-text a:hover{
        text-decoration: solid;
        color: greenyellow;
    }
    label{
        font-weight: bold;
    }
</style>
</head>
<body>
     <nav class="nav">
  <a class="nav-link active" aria-current="page" href="{% url 'index' %}">Home</a>
  <a class="nav-link" href="{% url 'about' %}">About</a>
  <a class="nav-link" href="{% url 'contact' %}">Contact</a>
  <a class="nav-link" href="{% url 'gallery' %}">Gallery</a>
  <a class="nav-link" href="{% url 'signup' %}">Sign Up</a>
</nav>
<div class="form-container">
<h2 style="text-align: center;">Creat Account</h2>
<form action="Create Account">
    <div class="form-group">
        <label for="">Full Name</label><br>
        <input type="text" placeholder="Enter your full name" required>
    </div>
    <div class="form-group">
        <label for="">Email Address:</label><br>
        <input type="text" placeholder="Enter your email" required>
    </div>
    <div class="form-group">
        <label for="">Password:</label><br>
        <input type="password" placeholder="Enter your Password" required>
    </div>
    <div class="form-group">
        <label for="">Confirm Password:</label><br>
        <input type="password" placeholder="Confirm Password" required>
    </div>
    <p>i agree to the Terms and Conditions</p>
    <button type="submit">Sign Up</button>
    <p class="footer-text">Already have an account?<a href="#">login</a></p>
</form>
</div>
</body>
</html>
